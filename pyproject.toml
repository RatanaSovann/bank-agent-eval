[project]
name = "bank-agent-eval"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.10.0",
    "beautifulsoup4>=4.15.0",
    "pypdf>=7.1.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
